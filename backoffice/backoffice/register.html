<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Crea una cuenta en el backoffice de la biblioteca.">
  <title>Crear cuenta · Biblioteca Backoffice</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="auth">
    <aside class="auth__brand">
      <a class="logo" href="login.html"><span class="logo__mark" aria-hidden="true"></span>Biblioteca</a>
      <div>
        <h2>Suma tu portafolio a la biblioteca.</h2>
        <p>Crea tu cuenta y empieza a registrar tus proyectos en minutos.</p>
      </div>
    </aside>

    <main class="auth__main">
      <section class="card" aria-labelledby="titulo">
        <h1 id="titulo">Crear cuenta</h1>
        <p class="card__sub">Completa tus datos para comenzar.</p>

        <p id="alert" class="alert" role="alert" hidden></p>

        <form id="register-form" action="register.html" method="post">
          <div class="field">
            <label for="name">Nombre completo</label>
            <input id="name" name="name" type="text" autocomplete="name" minlength="6" aria-describedby="name-hint" required>
            <p id="name-hint" class="hint">Mínimo 6 caracteres.</p>
          </div>
          <div class="field">
            <label for="email">Correo electrónico</label>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="nombre@correo.com" required>
          </div>
          <div class="field">
            <label for="itsonId">ID ITSON</label>
            <input id="itsonId" name="itsonId" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" aria-describedby="id-hint" required>
            <p id="id-hint" class="hint">6 dígitos numéricos.</p>
          </div>
          <div class="field">
            <label for="password">Contraseña</label>
            <input id="password" name="password" type="password" autocomplete="new-password" minlength="6" aria-describedby="pw-hint" required>
            <p id="pw-hint" class="hint">Mínimo 6 caracteres.</p>
          </div>
          <button class="btn" type="submit">Crear cuenta</button>
        </form>

        <p class="switch">¿Ya tienes cuenta? <a href="login.html">Iniciar sesión</a></p>
      </section>
    </main>
  </div>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
