<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Proyectos · Biblioteca Backoffice</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <noscript><p class="status">Este panel requiere JavaScript. <a href="login.html">Ir a iniciar sesión</a></p></noscript>

  <div class="app">
    <aside class="sidebar">
      <a class="logo" href="home.html"><span class="logo__mark" aria-hidden="true"></span>Biblioteca</a>
      <nav aria-label="Principal">
        <ul>
          <li><a href="home.html" aria-current="page">Proyectos</a></li>
        </ul>
      </nav>
    </aside>

    <main class="content">
      <header class="topbar">
        <div>
          <h1>Mis proyectos</h1>
          <p class="card__sub">Sesión de <strong id="user-name"></strong></p>
        </div>
        <div class="topbar__actions">
          <button id="add-btn" class="btn btn--auto" type="button">Agregar proyecto</button>
          <button id="logout-btn" class="btn btn--ghost" type="button">Cerrar sesión</button>
        </div>
      </header>

      <dl class="stats">
        <div class="stat"><dt>Proyectos</dt><dd id="stat-total">0</dd></div>
        <div class="stat"><dt>Tecnologías distintas</dt><dd id="stat-tech">0</dd></div>
        <div class="stat"><dt>Con repositorio</dt><dd id="stat-repo">0</dd></div>
      </dl>

      <section aria-labelledby="catalogo">
        <h2 id="catalogo">Catálogo</h2>
        <p id="status" class="status" role="status" hidden></p>
        <div id="empty" class="empty" hidden>
          <p>Aún no tienes proyectos registrados.</p>
          <p>Pulsa “Agregar proyecto” para crear el primero.</p>
        </div>
        <ul id="project-list" class="projects"></ul>
      </section>
    </main>
  </div>

  <template id="project-template">
    <li class="project">
      <img class="project__img" alt="" loading="lazy">
      <div class="project__body">
        <h3 class="project__title"></h3>
        <p class="project__desc"></p>
        <ul class="tags" aria-label="Tecnologías"></ul>
        <a class="project__repo" target="_blank" rel="noopener noreferrer">Ver repositorio</a>
      </div>
      <div class="project__actions">
        <button class="btn btn--ghost btn--small" type="button" data-action="edit">Actualizar</button>
        <button class="btn btn--danger btn--small" type="button" data-action="delete">Eliminar</button>
      </div>
    </li>
  </template>

  <dialog id="project-dialog" aria-labelledby="dialog-title">
    <form id="project-form">
      <h2 id="dialog-title">Agregar proyecto</h2>
      <p id="form-alert" class="alert alert--error" role="alert" hidden></p>

      <div class="field">
        <label for="p-title">Título</label>
        <input id="p-title" name="title" type="text" required>
      </div>
      <div class="field">
        <label for="p-description">Descripción</label>
        <textarea id="p-description" name="description" rows="3" required></textarea>
      </div>
      <div class="field">
        <label for="p-tech">Tecnologías</label>
        <input id="p-tech" name="technologies" type="text" placeholder="HTML, CSS, JavaScript" aria-describedby="tech-hint">
        <p id="tech-hint" class="hint">Sepáralas con comas.</p>
      </div>
      <div class="field">
        <label for="p-repo">Repositorio (opcional)</label>
        <input id="p-repo" name="repository" type="url" placeholder="https://github.com/usuario/proyecto">
      </div>
      <div class="field">
        <label for="p-images">Imágenes (opcional)</label>
        <textarea id="p-images" name="images" rows="2" placeholder="https://…" aria-describedby="img-hint"></textarea>
        <p id="img-hint" class="hint">Una URL por línea.</p>
      </div>

      <div class="dialog__actions">
        <button id="cancel-btn" class="btn btn--ghost" type="button">Cancelar</button>
        <button id="save-btn" class="btn btn--auto" type="submit">Crear proyecto</button>
      </div>
    </form>
  </dialog>

  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
